<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="160" viewBox="0 0 1280 160" role="img" aria-label="Everyday use">
<style>@font-face{font-family:'Geist';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Geist';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Geist Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Noto Sans JP';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
.mono{font-family:'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:15px;font-weight:400;fill:#A1A1AA}
.title{font-family:'Geist', Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:500;fill:#FAFAFA}
.tagline{font-family:'Geist', Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:26px;font-weight:400;letter-spacing:-0.65px;fill:#A1A1AA}
.mark{font-family:'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic UI', sans-serif;font-size:16px;fill:#A1A1AA}
</style>
  <defs>
    <clipPath id="frame"><rect width="1280" height="160" rx="12"/></clipPath>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#232324" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="45%" cy="45%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <mask id="grid-mask"><rect width="1280" height="160" fill="url(#fade)"/></mask>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="160" fill="#000000"/>
    <rect width="1280" height="160" fill="url(#grid)" mask="url(#grid-mask)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="159" rx="11.5" fill="none" stroke="#5C5C61"/>
  <text class="mono" x="56" y="52">05</text>
  <text class="title" x="54" y="116" font-size="48" letter-spacing="-1.2">Everyday use</text>
</svg>
